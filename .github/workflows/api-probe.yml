name: API probe (temporary)

on:
  push:
    branches: [stage-5]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Audio URL pattern and range support
        run: |
          S="https://cdn.mp3quran.net/audio/ibrahim-akhdar/r1/"
          for f in 001 002 114; do
            curl -sSIL -m 30 "${S}${f}.mp3" | grep -iE "^HTTP|content-length|accept-ranges|content-type|content-disposition" | tail -6
            echo ---
          done
          curl -sS -m 30 -r 0-99 -o /dev/null -w "range_status=%{http_code} range_bytes=%{size_download}\n" "${S}001.mp3"

      - name: API docs page terms hints
        run: |
          curl -sSL -m 30 "https://www.mp3quran.net/ar/api" -o api.html -w "docs_http=%{http_code} bytes=%{size_download}\n"
          python3 - <<'PY'
          import re,html
          t=open('api.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>',' ',t))
          t=re.sub(r'\s+',' ',t)
          for kw in ['شرو','ترخيص','license','حقوق','مجاني','الاستخدام','Terms','key','مفتاح']:
              i=t.find(kw)
              if i>=0: print(kw, '=>', t[max(0,i-120):i+200])
          print('len', len(t))
          PY
