name: API probe (temporary)

on:
  push:
    branches: [stage-5]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch reciters (Arabic) raw head
        run: curl -sS -m 30 "https://mp3quran.net/api/v3/reciters?language=ar" | head -c 2500; echo

      - name: Fetch reciters shape
        run: |
          curl -sS -m 30 "https://mp3quran.net/api/v3/reciters?language=ar" -o r.json
          python3 probe_shape.py r.json

      - name: Write shape script
        run: |
          printf '%s\n' \
            "import json, sys" \
            "d = json.load(open(sys.argv[1]))" \
            "print('top keys:', list(d.keys()) if isinstance(d, dict) else type(d))" \
            "rec = d.get('reciters', d) if isinstance(d, dict) else d" \
            "print('count:', len(rec))" \
            "r0 = rec[0]" \
            "print('reciter keys:', list(r0.keys()))" \
            "m0 = r0.get('moshaf', [{}])[0]" \
            "print('moshaf keys:', list(m0.keys()))" \
            "print('moshaf values:', {k: v for k, v in m0.items() if k != 'surah_list'})" \
            "print('surah_list:', m0.get('surah_list'))" > probe_shape.py
          python3 probe_shape.py r.json
