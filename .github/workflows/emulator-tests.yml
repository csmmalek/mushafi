name: Emulator tests (Android 10)

on:
  push:
    branches: [stage-5, stage-6, stage-7, stage-8, stage-9, stage-10, stage-11]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Run instrumented tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_5
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon || echo "TESTS_FAILED" > tests_failed.flag
            mkdir -p shots
            adb pull /sdcard/shots/. ./shots/ || true
            test ! -f tests_failed.flag

      - name: Publish screenshots branch
        if: always()
        run: |
          if ls shots/*.png >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/shots" && cp shots/*.png "$RUNNER_TEMP/shots/"
            git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
            git checkout --orphan screenshots-tmp
            git rm -rf -q . || true
            cp "$RUNNER_TEMP"/shots/*.png .
            echo "${GITHUB_SHA}" > source-commit.txt
            git add *.png source-commit.txt
            git commit -q -m "Screenshots for ${GITHUB_SHA}"
            git push -f origin HEAD:refs/heads/screenshots
          fi

      - name: Upload instrumented report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-report
          path: app/build/reports/androidTests/connected/
