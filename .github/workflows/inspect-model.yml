name: Inspect speech models
on:
  push:
    branches: [stage-9]
    paths: [.github/workflows/inspect-model.yml]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect candidate Quran speech models (metadata only, no weights kept)
        run: |
          python3 - <<'PY'
          import json, urllib.request, re
          def get(url, n=None):
              req = urllib.request.Request(url, headers={"User-Agent": "mushafi-ci"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read() if n is None else r.read(n)
              return data
          repos = ["seferdemir/whisper-base-ar-quran-onnx", "tarteel-ai/whisper-base-ar-quran",
                   "Osoo99/quran-whisper-sherpa-int8"]
          for repo in repos:
              print("=" * 70); print(repo)
              try:
                  info = json.loads(get(f"https://huggingface.co/api/models/{repo}?blobs=true"))
              except Exception as e:
                  print("API error", e); continue
              card = info.get("cardData") or {}
              print("license:", card.get("license"), "| tags:", info.get("tags", [])[:12])
              for s in info.get("siblings", []):
                  size = s.get("size")
                  print("  file", s["rfilename"], round(size/1e6, 1) if size else "?", "MB")
              try:
                  readme = get(f"https://huggingface.co/{repo}/raw/main/README.md", 6000).decode("utf-8", "replace")
                  print("--- README head ---"); print(readme[:3000])
              except Exception as e:
                  print("README error", e)
              for name in ("whisper_vocab.json", "vocab.json", "custom-tokens.txt", "tokens.txt"):
                  try:
                      raw = get(f"https://huggingface.co/{repo}/resolve/main/{name}").decode("utf-8", "replace")
                  except Exception:
                      continue
                  marks = re.findall(r"[ً-ْٰ]", raw)
                  print(f"{name}: {len(raw)} chars, arabic diacritic marks in vocab: {len(marks)}")
                  print("sample:", raw[:300].replace("\n", " "))
                  break
          PY
