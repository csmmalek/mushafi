name: Publish APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'رقم الإصدار الرسمي (مثل 0.8.0) أو اتركه فارغاً لتحديث أحدث نسخة تجريبية'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk mushafi-latest.apk
          if [[ "${GITHUB_REF}" == refs/tags/v* || -n "${INPUT_VERSION}" ]]; then
            if [[ -n "${INPUT_VERSION}" ]]; then VER="${INPUT_VERSION#v}"; TAG="v${VER}"; else TAG="${GITHUB_REF#refs/tags/}"; VER="${TAG#v}"; fi
            cp mushafi-latest.apk "mushafi-${VER}.apk"
            awk -v v="$VER" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
            gh release create "$TAG" "mushafi-${VER}.apk" --target "$GITHUB_SHA" --title "مصحفي ${VER}" --notes-file notes.md
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest mushafi-latest.apk --prerelease \
              --title "مصحفي - أحدث نسخة تجريبية" \
              --notes "نسخة تجريبية موقّعة بمفتاح debug، بُنيت من الفرع main (${GITHUB_SHA::7}). إن رفض أندرويد التحديث فوق نسخة قديمة فاحذفها ثم ثبّت."
          fi
