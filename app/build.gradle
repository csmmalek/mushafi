plugins {
    id 'com.android.application'
}

android {
    namespace 'com.csm.mushafi'
    compileSdk 35

    defaultConfig {
        applicationId "com.csm.mushafi"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "0.2.0-stage2"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

configurations.all {
    // kotlin-stdlib-jdk7/jdk8 are merged into kotlin-stdlib since 1.8; excluding them avoids duplicate classes.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
