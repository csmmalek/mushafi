plugins {
    id 'com.android.application'
}

android {
    namespace 'com.csm.mushafi'
    compileSdk 36

    defaultConfig {
        applicationId "com.csm.mushafi"
        minSdk 29
        targetSdk 36
        versionCode 8
        versionName "0.9.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // التوقيع بمفتاح المطوّر: يُقرأ من متغيرات البيئة (أسرار GitHub) ولا يُخزَّن في المستودع.
    signingConfigs {
        release {
            def ksFile = System.getenv("MUSHAFI_KEYSTORE")
            if (ksFile != null && new File(ksFile).exists()) {
                storeFile new File(ksFile)
                storePassword System.getenv("MUSHAFI_KEYSTORE_PASSWORD")
                keyAlias System.getenv("MUSHAFI_KEY_ALIAS")
                keyPassword System.getenv("MUSHAFI_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("MUSHAFI_KEYSTORE") != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    lint {
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.work:work-runtime:2.9.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.work:work-testing:2.9.1'
}

configurations.all {
    // kotlin-stdlib-jdk7/jdk8 are merged into kotlin-stdlib since 1.8; excluding them avoids duplicate classes.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
